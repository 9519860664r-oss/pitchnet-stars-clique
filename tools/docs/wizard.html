<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Installer side image</title>
<link rel="stylesheet" href="brand.css">
<style>
  /* 2x of Inno Setup's 164 x 314 wizard image. */
  html, body { width: 328px; height: 628px; overflow: hidden; }
  .stage { position: relative; width: 328px; height: 628px; }
  .logo { position: absolute; left: 34px; top: 70px; width: 260px; }
  .ed { position: absolute; left: 36px; top: 140px; font-size: 21px; font-weight: 600; color: var(--lilac); }

<div class="stage">

      <path id="b" d="M0,20 C4,8 14,4 26,6 C40,8 46,13 60,14 C76,15 88,12 96,16 C100,18 100,22 96,24 C88,28 76,25 60,26 C46,27 40,32 26,34 C14,36 4,32 0,20 Z"/>

    <use href="#b" transform="translate(130 80) scale(0.95 1)" fill="#F470B4"/>
    <use href="#b" transform="translate(200 120) scale(1.05 1)" fill="#8098FF"/>

</html>
